<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ferry</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f9f9fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e13" media="(prefers-color-scheme: dark)" />
    <script>
      // 在样式生效前按保存的深浅色加上 dark 类，免得首屏先闪一下浅色；逻辑同 src/lib/theme.ts。
      try {
        var m = localStorage.getItem('ferry.theme')
        if (m === 'dark' || (m !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
